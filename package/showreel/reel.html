<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperance Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07090b; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; cursor: pointer; }
  body.vertical canvas { width: min(100vw, calc(100vh * 9 / 16)); aspect-ratio: 9 / 16; }
  #hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: #8d9a9c; font: 13px "DM Mono", monospace; letter-spacing: .2em; }
  body.capture #hint { display: none; }
  body.capture canvas { width: auto; aspect-ratio: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">CLICK TO PLAY · SPACE PAUSE · ←/→ SCRUB · ?aspect=9x16 FOR VERTICAL</div>
<audio id="a" src="public/soundtrack.wav" preload="auto"></audio>
<svg id="measure" width="0" height="0" style="position:absolute"></svg>
<script>
"use strict";
// ───────────────────────────────────────────── constants
const params = new URLSearchParams(location.search);
// ?aspect=9x16 → vertical cut for socials. Same timeline, same soundtrack, re-laid-out scenes.
const VERT = params.get("aspect") === "9x16";
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080, FPS = 60, BEAT = 30, N = 900; // 120 BPM → 1 beat = 30 frames
if (VERT) document.body.classList.add("vertical");
const S = { ignite: 0, title: 120, phases: 240, routing: 480, verify: 660, lockup: 780, end: 900 };
// Tokens from docs/assets/te-docs.css
const C = {
  ink: "#07090b", panel: "#10161a", line: "#263138", lineBright: "#394951", text: "#e7eeed",
  muted: "#8d9a9c", cyan: "#65d9e8", ember: "#f39b54", gold: "#e9cf79", goldDeep: "#8a6d2a",
  mint: "#a8e7c4", rose: "#ff8990", data: "#3d8ea8",
};
const SERIF = '"Cormorant Garamond", Palatino, serif';
const SANS = '"Space Grotesk", system-ui, sans-serif';
const MONO = '"DM Mono", Menlo, monospace';

// ───────────────────────────────────────────── math
const bezier = (x1, y1, x2, y2) => {
  const B = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; if (B(t, x1, x2) < x) lo = t; else hi = t; }
    return B(t, y1, y2);
  };
};
const E = { out: bezier(.16, 1, .3, 1), in: bezier(.7, 0, .84, 0), io: bezier(.65, 0, .35, 1), back: bezier(.34, 1.56, .64, 1) };
const tw = (f, a, b, v0, v1, e = E.out) => v0 + (v1 - v0) * e(Math.min(1, Math.max(0, (f - a) / (b - a))));
const decay = (f, at, len) => (f < at ? 0 : Math.exp(-(f - at) / len));
const rad = (d) => (d * Math.PI) / 180;
const rnd = (s) => {
  let h = 2166136261; s = String(s);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
};
const noise = (s) => rnd(s) * 2 - 1;
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, g, b] = hexRGB(h); return `rgba(${r},${g},${b},${a})`; };
const mix = (a, b, t) => { const x = hexRGB(a), y = hexRGB(b), k = Math.min(1, Math.max(0, t)); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k))})`; };

const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>/\\[]{}";
const scramble = (text, f, start, per = 2, settle = 10) => text.split("").map((ch, i) => {
  if (ch === " ") return " ";
  if (f >= start + i * per + settle) return ch;
  if (f < start + i * per * 0.5) return "";
  return GLYPHS[Math.floor(rnd(`${text}${i}${Math.floor(f / 2)}`) * GLYPHS.length)];
}).join("");
const typed = (t, f, start, cps = 1.2) => t.slice(0, Math.max(0, Math.floor((f - start) * cps)));

// ───────────────────────────────────────────── canvas plumbing
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
const NS = "http://www.w3.org/2000/svg";
const measureSvg = document.getElementById("measure");
const PATHS = new Map();
const P = (d) => {
  let p = PATHS.get(d);
  if (!p) {
    const el = document.createElementNS(NS, "path");
    el.setAttribute("d", d);
    measureSvg.appendChild(el);
    p = { p: new Path2D(d), len: el.getTotalLength() };
    PATHS.set(d, p);
  }
  return p;
};
/** Stroke-dash draw-on: reveals `prog` (0..1) of the path. */
const draw = (x, d, prog, len) => {
  if (prog <= 0) return;
  const path = typeof d === "string" ? P(d) : { p: d, len };
  x.setLineDash([path.len, path.len + 2]);
  x.lineDashOffset = path.len * (1 - Math.min(1, prog));
  x.stroke(path.p);
  x.setLineDash([]);
};
const circ = (cx, cy, r) => `M${cx} ${cy - r} a${r} ${r} 0 1 1 0 ${2 * r} a${r} ${r} 0 1 1 0 ${-2 * r}`;
const poly = (n, r, rot) => "M" + Array.from({ length: n }, (_, i) => {
  const a = rad(rot + (i * 360) / n);
  return `${(Math.cos(a) * r).toFixed(2)} ${(Math.sin(a) * r).toFixed(2)}`;
}).join(" L") + " Z";

const pool = [];
/** Fresh, cleared offscreen layer #i. */
const layer = (i) => {
  if (!pool[i]) { const c = document.createElement("canvas"); c.width = W; c.height = H; pool[i] = c; }
  const c = pool[i], x = c.getContext("2d");
  x.setTransform(1, 0, 0, 1, 0, 0);
  Object.assign(x, { globalAlpha: 1, filter: "none", globalCompositeOperation: "source-over", shadowBlur: 0, shadowColor: "transparent" });
  x.clearRect(0, 0, W, H);
  return [c, x];
};
const comp = (dst, src, o = {}) => {
  const { alpha = 1, blur = 0, scale = 1, ox = W / 2, oy = H / 2, dx = 0, dy = 0, op = "source-over" } = o;
  if (alpha <= 0.002) return;
  dst.save();
  dst.globalAlpha *= alpha;
  dst.globalCompositeOperation = op;
  if (blur > 0.05) dst.filter = `blur(${blur.toFixed(2)}px)`;
  dst.translate(ox + dx, oy + dy);
  dst.scale(scale, scale);
  dst.translate(-ox, -oy);
  dst.drawImage(src, 0, 0);
  dst.restore();
};
/** Text with tracking; returns visual width. */
const txt = (x, s, px, py, font, color, o = {}) => {
  const { ls = 0, align = "left", base = "alphabetic", alpha = 1, glow = 0, glowC } = o;
  x.save();
  x.font = font; x.letterSpacing = `${ls}px`; x.textBaseline = base; x.textAlign = "left";
  x.fillStyle = color; x.globalAlpha *= alpha;
  if (glow) { x.shadowColor = glowC || color; x.shadowBlur = glow; }
  const w = x.measureText(s).width - (s.length ? ls : 0);
  const sx = align === "center" ? px - w / 2 : align === "right" ? px - w : px;
  if (alpha > 0.002) x.fillText(s, sx, py);
  x.restore();
  return w;
};
const textW = (x, s, font, ls = 0) => { x.save(); x.font = font; x.letterSpacing = `${ls}px`; const w = x.measureText(s).width - (s.length ? ls : 0); x.restore(); return w; };
const charW = (x, ch, font) => { x.save(); x.font = font; x.letterSpacing = "0px"; const w = x.measureText(ch).width; x.restore(); return w; };
const goldFill = (x, top, bottom) => {
  const g = x.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, "#fff3c4"); g.addColorStop(0.38, C.gold); g.addColorStop(0.7, "#c9a24a"); g.addColorStop(1, C.goldDeep);
  return g;
};

// ───────────────────────────────────────────── impacts / camera
const IMPACTS = [
  [S.title, 1], [S.phases, 0.45],
  ...[1, 2, 3, 4, 5, 6].map((i) => [S.phases + i * BEAT, 0.22]),
  [S.routing, 0.6], ...[1, 2, 3, 4, 5].map((i) => [S.routing + i * BEAT, 0.1]),
  [S.verify, 0.55], [S.lockup, 1.35],
];
const energy = (f) => IMPACTS.reduce((a, [at, p]) => a + p * decay(f, at, 7), 0);
const shake = (f) => { const e = energy(f); return { x: noise(`sx${f}`) * 26 * e, y: noise(`sy${f}`) * 18 * e, r: noise(`sr${f}`) * 0.6 * e }; };

// Background glow tempers through the alchemical colours: nigredo → albedo → citrinitas → rubedo.
const TINT = [
  [0, C.cyan], [S.title, C.gold], [S.phases, C.data], [S.phases + BEAT, C.text], [S.phases + 3 * BEAT, C.gold],
  [S.phases + 4 * BEAT, C.ember], [S.phases + 5 * BEAT, C.rose], [S.phases + 6 * BEAT, C.mint],
  [S.routing, C.cyan], [S.verify, C.mint], [S.lockup, C.gold],
];
const tint = (f) => {
  let i = 0;
  while (i < TINT.length - 1 && f >= TINT[i + 1][0]) i++;
  return mix(i === 0 ? TINT[0][1] : TINT[i - 1][1], TINT[i][1], (f - TINT[i][0]) / 14);
};

// ───────────────────────────────────────────── precomputed textures
const mk = (w, h, fn) => { const c = document.createElement("canvas"); c.width = w; c.height = h; fn(c.getContext("2d"), c); return c; };
const lattice = mk(W + 36, H + 36, (x) => {
  x.fillStyle = rgba(C.lineBright, 0.55);
  for (let y = 0; y < H + 36; y += 36) for (let i = 0; i < W + 36; i += 36) { x.beginPath(); x.arc(i + 18, y + 18, 1.1, 0, 7); x.fill(); }
  x.globalCompositeOperation = "destination-in";
  const g = x.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1000);
  g.addColorStop(0, "#000"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, W + 36, H + 36);
});
const grains = Array.from({ length: 6 }, (_, k) => mk(W / 2, H / 2, (x) => {
  const img = x.createImageData(W / 2, H / 2);
  let s = 1234567 + k * 7919;
  for (let i = 0; i < img.data.length; i += 4) {
    s = (Math.imul(s, 1103515245) + 12345) >>> 0;
    const v = s >>> 24;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}));
const scan = mk(4, 4, (x) => { x.fillStyle = "rgba(0,0,0,0.16)"; x.fillRect(0, 0, 4, 1); });
let scanPattern = null;

// ───────────────────────────────────────────── chrome
function backdrop(x, f) {
  x.fillStyle = C.ink; x.fillRect(0, 0, W, H);
  const drift = Math.sin(f / 90) * 60;
  const glow = (cx, cy, r, col, a) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  };
  glow(W * 0.72 + drift, -60 + drift / 2, 1000, C.gold, 0.1);
  glow(-80 - drift, H + 40, 900, C.cyan, 0.08);
  x.save();
  x.globalCompositeOperation = "screen";
  const t = tint(f), [r, g, b] = t.match(/\d+/g).map(Number);
  const gr = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 820);
  const a = 0.15 + energy(f) * 0.09;
  gr.addColorStop(0, `rgba(${r},${g},${b},${a})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  x.restore();
  x.save(); x.globalAlpha = 0.4;
  x.drawImage(lattice, -36 + ((f * 0.4) % 36), -36 + ((f * 0.25) % 36));
  x.restore();
}

function hud(x, f) {
  const a = Math.min(1, f / 24) * (f > 880 ? 1 - (f - 880) / 20 : 1);
  x.save(); x.globalAlpha = a;
  x.strokeStyle = rgba(C.gold, 0.7); x.lineWidth = 2;
  for (const [cx, cy, sx, sy] of [[40, 40, 1, 1], [W - 40, 40, -1, 1], [W - 40, H - 40, -1, -1], [40, H - 40, 1, -1]]) {
    x.beginPath(); x.moveTo(cx, cy + 34 * sy); x.lineTo(cx, cy); x.lineTo(cx + 34 * sx, cy); x.stroke();
  }
  const m = `400 15px ${MONO}`, ls = 3.3;
  txt(x, "●", 92, 66, m, C.gold);
  txt(x, "TEMPERANCE ENGINE · SHOWREEL", 116, 66, m, rgba(C.muted, 0.95), { ls });
  const sec = Math.floor(f / FPS), fr = f % FPS, pad = (n) => String(n).padStart(2, "0");
  txt(x, `TC 00:00:${pad(sec)}:${pad(fr)}`, W - 92, 66, m, C.cyan, { ls, align: "right" });
  txt(x, "XIV · HAND IN GLOVE", 92, H - 52, m, rgba(C.muted, 0.95), { ls });
  const bp = decay(f % BEAT, 0, 6);
  const w = txt(x, `120 BPM · ${W}×${H} · 60P`, W - 92, H - 52, m, rgba(C.muted, 0.95), { ls, align: "right" });
  x.save(); x.fillStyle = C.ember; x.shadowColor = C.ember; x.shadowBlur = 6 + bp * 18; x.globalAlpha *= 0.45 + bp * 0.55;
  x.beginPath(); x.arc(W - 92 - w - 18, H - 57, 4.5, 0, 7); x.fill(); x.restore();
  // timeline rail
  const L = 92, R = W - 92, y = H - 92;
  x.fillStyle = rgba(C.lineBright, 0.6); x.fillRect(L, y, R - L, 1);
  const g = x.createLinearGradient(L, 0, R, 0); g.addColorStop(0, C.cyan); g.addColorStop(1, C.gold);
  x.save(); x.fillStyle = g; x.shadowColor = rgba(C.gold, 0.8); x.shadowBlur = 12; x.fillRect(L, y - 0.5, (R - L) * (f / N), 2); x.restore();
  for (const at of Object.values(S)) { x.fillStyle = f >= at ? C.gold : C.lineBright; x.fillRect(L + (R - L) * (at / N), y - 5, 1, 11); }
  x.restore();
}

function flash(x, f) {
  const big = decay(f, S.title, 5) + decay(f, S.lockup, 7) * 1.2;
  const small = decay(f, S.phases, 3) * 0.4 + decay(f, S.routing, 3) * 0.5 + decay(f, S.verify, 3) * 0.45;
  const o = Math.min(1, big * 0.85 + small * 0.6);
  if (o < 0.003) return;
  x.save(); x.globalCompositeOperation = "screen"; x.globalAlpha = o;
  const g = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1100);
  g.addColorStop(0, "#fffaf0"); g.addColorStop(0.45, C.gold); g.addColorStop(1, rgba(C.ember, 0.6));
  x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore();
}

function finish(x, f) {
  x.save();
  x.globalCompositeOperation = "overlay"; x.globalAlpha = 0.09;
  x.drawImage(grains[f % grains.length], 0, 0, W, H);
  x.globalCompositeOperation = "source-over"; x.globalAlpha = 0.35;
  scanPattern = scanPattern || x.createPattern(scan, "repeat");
  x.fillStyle = scanPattern; x.fillRect(0, 0, W, H);
  x.globalAlpha = 1;
  const D = Math.hypot(W, H) / 2, v = x.createRadialGradient(W / 2, H / 2, D * 0.41, W / 2, H / 2, D * 1.08);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.8)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  x.restore();
}

function glitch(dst, src, amt, f) {
  let y = 0, k = 0;
  const step = Math.floor(f / 2);
  while (y < H) {
    const h = 30 + rnd(`gh${step}${k}`) * 140;
    const off = noise(`go${step}${k}`) * amt * 160;
    dst.drawImage(src, 0, y, W, h, off, y, W, h);
    y += h; k++;
  }
  dst.save(); dst.globalCompositeOperation = "lighter"; dst.globalAlpha = amt * 0.35;
  dst.drawImage(src, amt * 22, 0); dst.drawImage(src, -amt * 22, 0);
  dst.restore();
}

// ───────────────────────────────────────────── sigils (planetary, as in package/router/rail-announce.ts)
const SIGILS = {
  saturn: ["M40 12 V66", "M27 25 H53", "M40 46 Q42 36 53 37 Q66 39 63 54 Q60 66 51 74 Q45 81 55 88"],
  mercury: ["M35 10 Q50 30 65 10", circ(50, 42, 15), "M50 57 V90", "M37 76 H63"],
  sun: [circ(50, 50, 32), circ(50, 50, 4)],
  jupiter: ["M26 30 Q28 16 42 17 Q56 19 50 36 L28 64 H74", "M62 38 V90"],
  mars: [circ(42, 62, 20), "M56 47 L80 22", "M61 22 H80 V41"],
  venus: [circ(50, 37, 21), "M50 58 V92", "M35 76 H65"],
  moon: ["M60 12 A38 38 0 1 0 60 88 A30 30 0 1 1 60 12"],
};
function sigil(x, name, cx, cy, size, prog, color, stroke = 3, glow = 10) {
  const paths = SIGILS[name];
  x.save();
  x.translate(cx - size / 2, cy - size / 2); x.scale(size / 100, size / 100);
  x.strokeStyle = color; x.lineWidth = stroke; x.lineCap = "round"; x.lineJoin = "round";
  if (glow) { x.shadowColor = color; x.shadowBlur = glow; }
  paths.forEach((d, i) => draw(x, d, Math.min(1, Math.max(0, prog * (paths.length + 0.6) - i))));
  x.restore();
}

// ═════════════════════════════════════════════ SCENE 1 · IGNITION (0–120)
function ignition(x, f) {
  const CX = W / 2, CY = VERT ? 820 : 470, R = 280;
  const spin = f * 0.22 + tw(f, 88, 120, 0, 140, E.in);
  const sc = tw(f, 0, 90, 0.84, 1) * tw(f, 92, 120, 1, 3.6, E.in);
  const fade = tw(f, 104, 120, 1, 0, E.in);
  const dr = (a, b) => tw(f, a, b, 0, 1, E.io);

  const fl = tw(f, 0, 6, 0, 1) * tw(f, 6, 34, 1, 0);
  if (fl > 0.01) {
    x.save(); x.globalAlpha = fl;
    const g = x.createLinearGradient(CX - 900, 0, CX + 900, 0);
    g.addColorStop(0, rgba(C.cyan, 0)); g.addColorStop(0.35, rgba(C.cyan, 0.9)); g.addColorStop(0.5, "#ffffff");
    g.addColorStop(0.65, rgba(C.cyan, 0.9)); g.addColorStop(1, rgba(C.cyan, 0));
    x.fillStyle = g; x.shadowColor = C.cyan; x.shadowBlur = 16;
    const w = 1800 * (0.2 + fl * 0.8); x.fillRect(CX - w / 2, CY - 1.5, w, 3); x.restore();
  }

  x.save();
  x.globalAlpha = fade; x.translate(CX, CY); x.rotate(rad(spin)); x.scale(sc, sc);
  x.lineCap = "round"; x.lineJoin = "round"; x.shadowColor = rgba(C.gold, 0.7); x.shadowBlur = 8;
  x.strokeStyle = C.gold; x.lineWidth = 2; draw(x, circ(0, 0, R), dr(4, 40));
  x.strokeStyle = rgba(C.gold, 0.35); x.lineWidth = 1; draw(x, circ(0, 0, R + 46), dr(10, 52));
  for (let i = 0; i < 72; i++) {
    const a = rad(i * 5), long = i % 6 === 0, on = tw(f, 10 + i * 0.55, 14 + i * 0.55, 0, 1);
    if (on <= 0) continue;
    const r1 = R + 12, r2 = r1 + ((long ? 22 : 10) * on);
    x.strokeStyle = long ? C.gold : rgba(C.gold, 0.5); x.lineWidth = long ? 2 : 1;
    x.beginPath(); x.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); x.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); x.stroke();
  }
  x.lineWidth = 1.6; x.strokeStyle = C.gold; draw(x, poly(3, R, -90), dr(18, 50));
  x.save(); x.strokeStyle = C.cyan; x.shadowColor = C.cyan; draw(x, poly(3, R, 90), dr(24, 56)); x.restore();
  x.strokeStyle = rgba(C.gold, 0.8); x.lineWidth = 1.4; draw(x, poly(4, R * 0.707, 45), dr(30, 62));
  x.strokeStyle = C.gold; draw(x, circ(0, 0, 140), dr(36, 66));
  x.save(); x.globalAlpha *= tw(f, 44, 60, 0, 1); x.strokeStyle = rgba(C.cyan, 0.55); x.lineWidth = 1; x.setLineDash([3, 9]);
  x.beginPath(); x.arc(0, 0, 98, 0, Math.PI * 2); x.stroke(); x.restore();
  for (let i = 0; i < 7; i++) {
    const a = rad(-90 + (i * 360) / 7), on = tw(f, 50 + i * 3, 58 + i * 3, 0, 1, E.back);
    if (on <= 0) continue;
    x.save(); x.translate(Math.cos(a) * R, Math.sin(a) * R); x.scale(on, on);
    x.fillStyle = C.ink; x.strokeStyle = C.gold; x.lineWidth = 2;
    x.beginPath(); x.arc(0, 0, 13, 0, 7); x.fill(); x.stroke();
    x.fillStyle = C.cyan; x.shadowColor = C.cyan; x.shadowBlur = 10; x.beginPath(); x.arc(0, 0, 5, 0, 7); x.fill();
    x.restore();
  }
  x.restore();

  // the spark
  const s = tw(f, 0, 10, 0, 1, E.back) * (1 + 0.15 * Math.sin(f / 3)) * tw(f, 96, 118, 1, 4, E.in);
  if (s > 0.01 && fade > 0.01) {
    x.save(); x.globalAlpha = fade;
    const g = x.createRadialGradient(CX, CY, 0, CX, CY, 90 * s);

// ═════════════════════════════════════════════ SCENE 3 · SEVEN PHASES (240–480)

    ? { WX: W / 2, WY: 690, WR: 270, hy: 1150, wy: 1290, sy: 1458, dy: 1524, center: true }

  const enter = tw(f, 0, 16, 0, 1), exit = tw(f, 206, 240, 0, 1, E.in), sceneA = enter * (1 - tw(f, 226, 240, 0, 1));

  const h0 = startX(headW);

  const word = (text, mode) => {
    let cx = startX(wordWidth(text));
    text.split("").forEach((ch, i) => {
      const p = mode === "in" ? tw(lf, 3 + i * 1.1, 3 + i * 1.1 + 11, 0, 1, E.back) : 1 - tw(lf, i * 0.35, i * 0.35 + 4, 0, 1, E.in);

  comet(x, curve(HUB, TERM_OUT, ...RL.home), f, 140, 152, C.mint);

  // hub
  const hd = tw(f, 18, 48, 0, 1, E.io), hs = tw(f, 14, 34, 0.4, 1, E.back);
  x.save(); x.globalAlpha *= tw(f, 14, 26, 0, 1); x.translate(HUB.x, HUB.y); x.scale(hs, hs);
  x.save(); x.rotate(rad(f * 0.6)); x.fillStyle = rgba(C.ink, 0.92); x.fill(P(poly(6, 92, 0)).p);
  x.strokeStyle = C.cyan; x.lineWidth = 2; x.shadowColor = C.cyan; x.shadowBlur = 14; draw(x, poly(6, 92, 0), hd); x.restore();
  x.save(); x.rotate(rad(-f * 1.2)); x.setLineDash([4, 8]); x.strokeStyle = rgba(C.gold, 0.6); x.lineWidth = 1.2; x.beginPath(); x.arc(0, 0, 124, 0, 7); x.stroke(); x.restore();
  x.strokeStyle = rgba(C.gold, 0.25); x.lineWidth = 1; x.beginPath(); x.arc(0, 0, 150, 0, 7); x.stroke();
  const hp = decay(f, 54, 8);
  if (hp > 0.01) { x.globalAlpha *= hp; x.strokeStyle = C.cyan; x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 124 + hp * 60, 0, 7); x.stroke(); }
  x.restore();
  txt(x, ">_", HUB.x, HUB.y + 16, `500 50px ${MONO}`, C.cyan, { align: "center", alpha: hd, glow: 18 });
  txt(x, "OMNIROUTE", HUB.x, HUB.y + 180, `400 16px ${MONO}`, C.cyan, { ls: 6.4, align: "center", alpha: hd });

  // lane chips
  LANES.forEach((l, i) => {
    const on = tw(f, 54 + i * 4, 66 + i * 4, 0, 1, E.back), hot = selected && l.name === "CREATIVE";
    if (on <= 0.01) return;
    const s = on * (hot ? 1.12 + decay(f, 84, 8) * 0.25 : 1);
    x.save(); x.translate(l.x, l.y); x.scale(s, s); x.globalAlpha *= selected && !hot ? 0.35 : 1;
    if (hot) { x.shadowColor = rgba(C.gold, 0.8); x.shadowBlur = 20 + decay(f, 84, 10) * 40; }
    x.fillStyle = hot ? C.gold : rgba(C.panel, 0.96); x.fillRect(-90, -19, 180, 38);
    x.shadowBlur = 0; x.strokeStyle = hot ? C.gold : C.lineBright; x.lineWidth = 1; x.strokeRect(-89.5, -18.5, 179, 37);
    txt(x, l.name, 0, 1, `400 14px ${MONO}`, hot ? C.ink : C.text, { ls: 2.5, align: "center", base: "middle" });
    x.restore();
  });

  // model combos
  NODES.forEach((n, i) => {
    const on = tw(f, 36 + i * 5, 50 + i * 5, 0, 1, E.back);
    if (on <= 0.01) return;
    const isFail = i === 2 && f >= 104, isOk = i === 3 && ok, col = isFail ? C.rose : isOk ? C.mint : C.gold;
    const jx = isFail ? noise(`n${f}`) * fail * 10 : 0;
    x.save(); x.translate(n.x + jx, n.y); x.scale(on, on);
    x.shadowColor = rgba(col, isFail || isOk ? 0.9 : 0.5); x.shadowBlur = isFail || isOk ? 34 : 14;
    x.fillStyle = C.ink; x.strokeStyle = rgba(col, 0.9); x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 18, 0, 7); x.fill(); x.stroke();
    x.fillStyle = col; x.shadowColor = col; x.shadowBlur = 12; x.beginPath(); x.arc(0, 0, 7, 0, 7); x.fill();
    x.shadowBlur = 0;
    const labelC = isFail ? C.rose : isOk ? C.mint : C.muted;
    // badge centre: right of the label (landscape) or under it (vertical)
    let bx, by;
    if (VERT) {
      txt(x, n.label, 0, 50, `400 17px ${MONO}`, labelC, { ls: 1, align: "center" });
      bx = 0; by = 76;
    } else {
      const lw = txt(x, n.label, 36, 6, `400 17px ${MONO}`, labelC, { ls: 1 });
      bx = 36 + lw + 39; by = 1;
    }
    if (isFail) { x.strokeStyle = C.rose; x.strokeRect(bx - 25, by - 13, 50, 26); txt(x, "429", bx, by + 6, `500 16px ${MONO}`, C.rose, { align: "center" }); }
    if (isOk) { x.fillStyle = C.mint; x.fillRect(bx - 25, by - 13, 50, 26); txt(x, "200", bx, by + 6, `500 16px ${MONO}`, C.ink, { align: "center" }); }
    x.restore();
  });
  x.restore();
}

// ═════════════════════════════════════════════ SCENE 5 · VERIFY (660–780)
const ISCS = [
  "route resolves to a live combo", "failover lands in < 500 ms", "Anti: no private memory copied",
  "backup written before any install", "verify.sh exits 0", "voice is skip-safe without packs",
  "skill index resolves every cluster", "Manifest cannot approve or launch", "/gsd:goal binds the PAI mode",
  "Anti: no second planner authority", "doctor reports provider health", "ISA sections pass the tier gate",
  "rollback restores the last backup", "enrich injects routing context", "CodeGraph routes .agents lookups",
  "Anti: no credentials in templates", "Pulse /healthz returns 200", "STE gate holds the docs baseline",
  "phase sigils announce on the rail", "learning lands in MEMORY", "every cut sits on the beat", "the scale finds its balance",
];
function verify(dst, f) {
  const [vc, x] = layer(2);
  const enter = tw(f, 0, 12, 0, 1), implode = tw(f, 100, 114, 0, 1, E.in);
  // Landscape: list left, gauge right. Vertical: gauge on top, list scrolling beneath; `dy` shifts the list block.
  const VL = VERT
    ? { dy: 740, lx: 90, probeX: [60, W - 60], gauge: [540, 660], stamp: [540, 960], origin: [540, 960], head: [[90, 270], [90, 362]] }
    : { dy: 0, lx: 110, probeX: [80, 1080], gauge: [1440, 590], stamp: [1440, 890], origin: [960, 560], head: null };
  const ROW = 54, PROBE = 600 + VL.dy;
  const scroll = tw(f, 0, 98, 0, 1, E.in) * (ISCS.length * ROW - 120) + f * 0.6;
  const gauge = tw(f, 4, 92, 0, 1, E.io), stamp = tw(f, 92, 102, 0, 1, E.back);

  const hf = `italic 500 82px ${SERIF}`, ey = (1 - enter) * 30;
  const [h1, h2] = VL.head || [[110, 200], null];
  const w1 = txt(x, "The ISA is", h1[0], h1[1] + ey, hf, C.text);
  const hp2 = h2 || [h1[0] + w1 + 22, h1[1]];
  txt(x, "the test harness.", hp2[0], hp2[1] + ey, hf, C.gold, { glow: 30, glowC: rgba(C.gold, 0.4) });

  // criteria scroll up through the probe line and flip to [x]
  const [lc, l] = layer(1);
  ISCS.forEach((text, i) => {
    const y = 330 + VL.dy + i * ROW + 110 - scroll;
    if (y < 220 + VL.dy || y > 960 + VL.dy) return;
    const passed = y + ROW / 2 < PROBE, just = passed && y + ROW / 2 > PROBE - 60, anti = text.startsWith("Anti:");
    const bx = VL.lx + (just ? 10 : 0), by = y + ROW / 2 + 8, mf = `400 24px ${MONO}`;
    l.save(); l.globalAlpha = passed ? 1 : 0.55;
    let cx = bx + txt(l, `[${passed ? "x" : " "}]`, bx, by, mf, passed ? C.mint : C.lineBright, { glow: passed ? 12 : 0 }) + 22;
    cx += txt(l, `ISC-${String(i + 1).padStart(2, "0")}`, cx, by, mf, passed ? C.gold : C.muted) + 22;
    txt(l, text, cx, by, mf, anti ? (passed ? C.rose : C.muted) : passed ? C.text : C.muted);
    l.restore();
  });
  l.globalCompositeOperation = "destination-in";
  const mTop = 270 + VL.dy, mBot = 910 + VL.dy;
  const m = l.createLinearGradient(0, mTop, 0, mBot);
  m.addColorStop(0, "rgba(0,0,0,0)"); m.addColorStop(0.18, "#000"); m.addColorStop(0.82, "#000"); m.addColorStop(1, "rgba(0,0,0,0)");
  l.fillStyle = m; l.fillRect(0, mTop, W, mBot - mTop);
  l.globalCompositeOperation = "source-over";
  l.clearRect(0, 0, W, mTop); l.clearRect(0, mBot, W, H - mBot);
  comp(x, lc);
  const [pa, pb] = VL.probeX;
  x.save(); const pg = x.createLinearGradient(pa, 0, pb, 0); pg.addColorStop(0, C.cyan); pg.addColorStop(1, rgba(C.cyan, 0.1));
  x.fillStyle = pg; x.shadowColor = C.cyan; x.shadowBlur = 18; x.fillRect(pa, PROBE, pb - pa, 2); x.restore();
  txt(x, "PROBE", pb - 80, PROBE - 14, `400 14px ${MONO}`, C.cyan, { ls: 4.2 });

  // gauge
  const [GX, GY] = VL.gauge;
  x.save(); x.translate(GX, GY);
  for (let i = 0; i < 96; i++) {
    const a = rad((i / 96) * 360 - 90), lit = i / 96 < gauge;
    x.save(); x.strokeStyle = lit ? C.gold : C.line; x.lineWidth = 3; if (lit) { x.shadowColor = C.gold; x.shadowBlur = 5; }
    x.beginPath(); x.moveTo(Math.cos(a) * 214, Math.sin(a) * 214); x.lineTo(Math.cos(a) * (lit ? 244 : 232), Math.sin(a) * (lit ? 244 : 232)); x.stroke(); x.restore();
  }
  x.strokeStyle = rgba(C.lineBright, 0.8); x.lineWidth = 1; x.beginPath(); x.arc(0, 0, 196, 0, 7); x.stroke();
  const gc = stamp > 0 ? C.mint : C.cyan;
  if (gauge > 0) { x.save(); x.strokeStyle = gc; x.lineWidth = 5; x.lineCap = "round"; x.shadowColor = gc; x.shadowBlur = 12; x.beginPath(); x.arc(0, 0, 196, -Math.PI / 2, -Math.PI / 2 + gauge * Math.PI * 2); x.stroke(); x.restore(); }
  const sw = decay(f, 92, 8);
  if (sw > 0.01) { x.save(); x.globalAlpha = sw; x.strokeStyle = C.mint; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 196 + (1 - sw) * 120, 0, 7); x.stroke(); x.restore(); }
  x.restore();
  txt(x, String(Math.round(gauge * 128)), GX, GY + 30, `700 150px ${SANS}`, C.text, { ls: -6, align: "center" });
  txt(x, "/ 128 ISC", GX, GY + 78, `400 18px ${MONO}`, C.muted, { ls: 5.8, align: "center" });
  if (stamp > 0.002) {
    x.save(); x.translate(VL.stamp[0], VL.stamp[1]); x.rotate(rad(-4)); x.scale(1.8 - stamp * 0.8, 1.8 - stamp * 0.8); x.globalAlpha = Math.min(1, stamp);
    x.shadowColor = rgba(C.mint, 0.6); x.shadowBlur = 30; x.strokeStyle = C.mint; x.lineWidth = 2; x.strokeRect(-170, -30, 340, 60);
    x.fillStyle = rgba(C.mint, 0.08); x.fillRect(-170, -30, 340, 60);
    txt(x, "VERIFIED", 0, 2, `700 34px ${SANS}`, C.mint, { ls: 14, align: "center", base: "middle", glow: 16 });
    x.restore();
  }
  comp(dst, vc, { alpha: enter * (1 - tw(f, 108, 114, 0, 1)), scale: 1 - implode * 0.94, ox: VL.origin[0], oy: VL.origin[1], blur: implode * 8 });
}

// ═════════════════════════════════════════════ SCENE 6 · LOCKUP (780–900)
function emblem(x, f) {
  const d = (a, b) => tw(f, a, b, 0, 1, E.io);
  // knocked off balance by the impact, the beam settles to perfect level
  const t = Math.max(0, f - 6), tilt = f < 6 ? 0 : 16 * Math.exp(-t / 16) * Math.cos(t / 4.2), r = rad(tilt);
  const ends = [-1, 1].map((s) => ({ x: Math.cos(r) * 150 * s, y: -92 + Math.sin(r) * 150 * s }));
  x.save();
  x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = C.gold; x.lineWidth = 6; x.shadowColor = rgba(C.gold, 0.7); x.shadowBlur = 12;
  draw(x, "M0 -196 L-12 -160 H12 Z", d(0, 18));
  draw(x, "M0 -160 V-62", d(2, 20));
  draw(x, "M0 82 V176", d(6, 24));
  draw(x, "M-70 190 H70 M-50 176 H50 M-90 204 H90", d(10, 30));
  const beam = new Path2D(`M${ends[0].x} ${ends[0].y} L${ends[1].x} ${ends[1].y}`);
  draw(x, beam, d(4, 22), 300);
  x.fillStyle = C.ink; x.beginPath(); x.arc(0, -92, 14, 0, 7); x.fill(); draw(x, circ(0, -92, 14), d(4, 20));
  ends.forEach((e) => {
    x.save(); x.translate(e.x, e.y);
    x.fillStyle = C.ink; x.beginPath(); x.arc(0, 0, 10, 0, 7); x.fill(); draw(x, circ(0, 0, 10), d(14, 26));
    x.lineWidth = 3; draw(x, "M0 8 L-52 120 M0 8 L52 120 M0 8 V120", d(16, 34));
    x.lineWidth = 6; x.fillStyle = rgba(C.gold, tw(f, 34, 50, 0, 0.18)); x.fill(P("M-66 120 Q0 176 66 120 Z").p); draw(x, "M-66 120 Q0 176 66 120 Z", d(20, 40));
    x.restore();
  });
  x.lineWidth = 7; draw(x, circ(0, 10, 72), d(6, 30));
  x.lineWidth = 3.5; draw(x, "M-122 168 L-70 246 L0 284 L70 246 L122 168 M-122 168 L-40 150 L0 176 L40 150 L122 168", d(22, 46));
  x.restore();
  x.save();
  x.strokeStyle = C.cyan; x.lineWidth = 9; x.lineCap = "round"; x.lineJoin = "round"; x.shadowColor = C.cyan; x.shadowBlur = 14;
  draw(x, "M-30 -14 L4 10 L-30 34", d(18, 32));
  if (f > 32 && Math.floor((f + S.lockup) / BEAT) % 2 === 0) { x.beginPath(); x.moveTo(12, 38); x.lineTo(38, 38); x.stroke(); }
  x.restore();
  [[-122, 168], [-70, 246], [0, 284], [70, 246], [122, 168]].forEach(([nx, ny], i) => {
    const s = tw(f, 30 + i * 3, 42 + i * 3, 0, 1, E.back);
    if (s <= 0.01) return;
    x.save(); x.translate(nx, ny); x.scale(s, s);
    x.fillStyle = C.ink; x.strokeStyle = C.gold; x.lineWidth = 4; x.beginPath(); x.arc(0, 0, 17, 0, 7); x.fill(); x.stroke();
    x.fillStyle = C.cyan; x.shadowColor = C.cyan; x.shadowBlur = 12; x.beginPath(); x.arc(0, 0, 8, 0, 7); x.fill();
    x.restore();
  });
}
function lockup(dst, f) {
  const [lc, x] = layer(1);
  // Vertical stacks the wordmark on two lines and gives the emblem full scale.
  const LK = VERT
    ? { CX: W / 2, CY: 700, emY: 760, emS: 1, size: 150, lines: [["Temperance", 1150, 0], ["Engine", 1300, 5]],
        hand: 1392, credit: [["THOUGHTSEED LABS", 1454], ["github.com/Sheshiyer/temperance_engine", 1490]] }
    : { CX: 960, CY: 480, emY: 380, emS: 0.786, size: 132, lines: [["Temperance Engine", 676, 0]],
        hand: 752, credit: [["THOUGHTSEED LABS · github.com/Sheshiyer/temperance_engine", 812]] };
  const { CX, CY } = LK, out = tw(f, 100, 120, 0, 1, E.in);

  [C.gold, C.cyan, C.ember].forEach((c, i) => {
    const p = tw(f, i * 4, i * 4 + 44, 0, 1);
    if (p <= 0 || p >= 1) return;
    x.save(); x.globalAlpha = (1 - p) * 0.9; x.strokeStyle = c; x.lineWidth = (1 - p) * 14 + 0.5;
    x.beginPath(); x.arc(CX, CY, 40 + p * 1300, 0, 7); x.stroke(); x.restore();
  });
  const bp = tw(f, 0, 70, 0, 1);
  if (bp < 1) {
    x.save();
    for (let i = 0; i < 160; i++) {
      const a = rnd(`a${i}`) * Math.PI * 2, rr = (300 + rnd(`v${i}`) * 900) * bp, c = rnd(`c${i}`) > 0.6 ? C.cyan : C.gold;
      x.globalAlpha = (1 - bp) * 0.95; x.fillStyle = c; x.shadowColor = c; x.shadowBlur = 8;
      x.beginPath(); x.arc(CX + Math.cos(a) * rr, CY + Math.sin(a) * rr + bp * bp * 120, 1 + rnd(`r${i}`) * 3.4, 0, 7); x.fill();
    }
    x.restore();
  }

  const k = tw(f, 0, 26, 0.55, 1, E.back);
  x.save(); x.translate(CX, LK.emY); x.scale(k, k); x.translate(0, -95); x.scale(LK.emS, LK.emS);
  emblem(x, f);
  x.restore();

  // wordmark: letters resolve from the centre of each line outward
  const font = `600 ${LK.size}px ${SERIF}`, trk = -2.6 * (LK.size / 132), gk = LK.size / 132;
  for (const [WORD, base, delay] of LK.lines) {
    const mid = (WORD.length - 1) / 2;
    const ws = WORD.split("").map((ch) => charW(x, ch, font)), total = ws.reduce((a, b) => a + b, 0) + trk * (WORD.length - 1);
    let cx = CX - total / 2;
    WORD.split("").forEach((ch, i) => {
      const t0 = 10 + delay + Math.abs(i - mid) * 1.6, p = tw(f, t0, t0 + 18, 0, 1);
      if (p > 0.002 && ch !== " ") {
        x.save(); x.globalAlpha = p; x.font = font; x.letterSpacing = "0px";
        if ((1 - p) * 12 > 0.1) x.filter = `blur(${((1 - p) * 12).toFixed(2)}px)`;
        x.translate(cx + ws[i] / 2, base + (1 - p) * 40); x.scale(1.4 - p * 0.4, 1.4 - p * 0.4);
        x.fillStyle = goldFill(x, -105 * gk, 15 * gk); x.shadowColor = rgba(C.gold, 0.35); x.shadowBlur = 30; x.shadowOffsetY = 6;
        x.fillText(ch, -ws[i] / 2, 0); x.restore();
      }
      cx += ws[i] + trk;
    });
  }

  const hw = txt(x, "HAND IN GLOVE", CX, LK.hand, `400 20px ${MONO}`, C.cyan, { ls: 9.2, align: "center", alpha: tw(f, 30, 46, 0, 1) });
  const rl = tw(f, 26, 60, 0, VERT ? 170 : 260);
  for (const s of [-1, 1]) {
    const x0 = CX + s * (hw / 2 + 26), g = x.createLinearGradient(x0, 0, x0 + s * rl, 0);
    g.addColorStop(0, C.gold); g.addColorStop(1, rgba(C.gold, 0));
    x.fillStyle = g; x.fillRect(Math.min(x0, x0 + s * rl), LK.hand - 7, rl, 1);
  }
  LK.credit.forEach(([line, y], i) =>
    txt(x, line, CX, y, `400 17px ${MONO}`, C.muted, { ls: 4, align: "center", alpha: tw(f, 42 + i * 4, 60 + i * 4, 0, 1) }));

  comp(dst, lc, { alpha: 1 - out, scale: 1 + f * 0.0006 });
}

// ───────────────────────────────────────────── frame
function render(f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  backdrop(ctx, f);
  const [sc, sx] = layer(0);
  if (f < S.title) ignition(sx, f);
  else if (f < S.phases) title(sx, f - S.title);
  else if (f < S.routing) phases(sx, f - S.phases);
  else if (f < S.verify) routing(sx, f - S.routing);
  else if (f < S.lockup) verify(sx, f - S.verify);
  else lockup(sx, f - S.lockup);

  const g = f >= S.routing + 160 && f < S.verify ? tw(f, S.routing + 160, S.verify, 0, 1, E.in) : f >= S.verify && f < S.verify + 8 ? tw(f, S.verify, S.verify + 8, 1, 0) : 0;
  const sh = shake(f);
  ctx.save();
  ctx.translate(W / 2 + sh.x, H / 2 + sh.y); ctx.rotate(rad(sh.r)); ctx.translate(-W / 2, -H / 2);
  if (g > 0.01) glitch(ctx, sc, g, f); else ctx.drawImage(sc, 0, 0);
  ctx.restore();
  hud(ctx, f);
  flash(ctx, f);
  finish(ctx, f);
}

// ───────────────────────────────────────────── harness: live preview, or frame-exact capture
const FONT_SPECS = [`500 40px ${SERIF}`, `600 40px ${SERIF}`, `italic 500 40px ${SERIF}`, `400 20px ${MONO}`, `500 20px ${MONO}`,
  `400 20px ${SANS}`, `600 20px ${SANS}`, `700 20px ${SANS}`];
const fontsReady = () => Promise.all(FONT_SPECS.map((s) => document.fonts.load(s, "Temperance ENGINE 0123 →✓·"))).then(() => document.fonts.ready);

async function capture() {
  document.body.classList.add("capture");
  await fontsReady();
  const fontCheck = FONT_SPECS.map((s) => `${document.fonts.check(s) ? "ok" : "MISSING"} ${s}`);
  await fetch("/log", { method: "POST", body: fontCheck.join("\n") });
  const only = params.get("frames");
  const from = Number(params.get("from") || 0), to = Number(params.get("to") || N);
  const list = only ? only.split(",").map(Number) : Array.from({ length: to - from }, (_, i) => from + i);
  for (const f of list) {
    render(f);
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    await fetch(`/frame?i=${f}`, { method: "POST", body: blob });
  }
  await fetch("/done", { method: "POST" });
}

function preview() {
  const audio = document.getElementById("a");
  // Without public/soundtrack.wav (run `bun run sound`), play silently on the wall clock.
  let f = 0, playing = false, silent = false, t0 = 0;
  audio.addEventListener("error", () => { silent = true; });
  const tick = () => {
    if (playing) {
      const t = silent ? (performance.now() - t0) / 1000 : audio.currentTime;
      f = Math.min(N - 1, Math.floor(t * FPS));
      if (silent ? f >= N - 1 : audio.ended) playing = false;
    }
    render(f);
    requestAnimationFrame(tick);
  };
  const startClock = () => { silent = true; t0 = performance.now() - (f / FPS) * 1000; };
  const toggle = () => {
    if (playing) { if (!silent) audio.pause(); playing = false; return; }
    if (f >= N - 1) f = 0;
    playing = true;
    if (silent) return startClock();
    audio.currentTime = f / FPS;
    audio.play().catch(startClock);
  };
  cv.addEventListener("click", toggle);
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
      if (!silent) audio.pause();
      playing = false;
      f = Math.max(0, Math.min(N - 1, f + (e.code === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 30 : 1)));
    }
  });
  fontsReady().then(() => { f = Number(params.get("f") || 0); tick(); });
}

params.has("capture") ? capture() : preview();
