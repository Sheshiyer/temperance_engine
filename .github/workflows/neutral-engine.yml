name: Neutral engine source qualification
on:
  push:
    branches: [main, codex/generic-glove-20261104]
  pull_request:
    paths: ["package/install-surface/**", "package/router/**", ".github/workflows/neutral-engine.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        # Standard runners, no paid larger runners or external inference.
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: package/install-surface
      - run: bun run typecheck
        working-directory: package/install-surface
      - name: Neutral boundaries, compatibility and disposable recovery
        run: bun test package/router/portable-phase-kernel.test.ts package/router/surface-portability.test.ts package/install-surface/test/composition.test.ts package/install-surface/test/composition-lifecycle.test.ts package/install-surface/test/vestibule.test.ts package/install-surface/test/engine-v2.test.ts package/install-surface/test/engine-adapters-v2.test.ts package/install-surface/test/lifecycle-safety.test.ts package/install-surface/test/lifecycle-scope.test.ts
      - name: Record actual platform and disposable client installation versions
        run: bun package/install-surface/scripts/qualify-source.ts --clients --output qualification/receipt.json
      - name: Upload bounded receipt, never client output or native state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-qualification-${{ matrix.os }}
          path: qualification/receipt.json
          if-no-files-found: warn
          retention-days: 30
